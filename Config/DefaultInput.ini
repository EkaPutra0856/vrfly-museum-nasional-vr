[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bEnableMotionControls=True
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde

; The VR mapping context (IMC_MuseumVR) must be listed under
; [/Script/EnhancedInput.EnhancedInputDeveloperSettings] DefaultMappingContexts once it exists,
; otherwise OpenXR never sees the Quest buttons (lesson from Zoo).

; VR copy: OpenXR builds its actions only from these contexts (without it the Quest buttons never reach the game).
; bAddImmediately=False: the context is added by UMuseumVRComponent in VR only, desktop input is unchanged.
[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableDefaultMappingContexts=True
+DefaultMappingContexts=(InputMappingContext="/Game/ZooVR/Input/IMC_ZooVR.IMC_ZooVR",Priority=2,bAddImmediately=False,bRegisterWithUserSettings=False)
